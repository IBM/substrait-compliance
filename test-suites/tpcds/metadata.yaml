name: "tpcds"
version: "1.0.0"
description: "TPC-DS Benchmark Compliance Suite - Decision Support Benchmark at Scale Factor 0.01"
scale_factor: 0.01
total_rows: 288000

# TPC-DS decision support benchmark — 99 queries
# Parameter substitutions used (TPC-DS spec values for SF 0.01):
#   YEAR=2000  YEAR2=2001  MONTH=11  QUARTER=4  STATE=TN
#   MANUFACT=9  GENDER=F  MARITAL_STATUS=S  EDUCATION=College
#   CHANNEL_EMAIL=N  SALES=1000  LIMIT=100

testCases:
  - id: "q01"
    description: "Customer Returns Analysis - Find customers with high return rates"
    complexity: "MEDIUM"
    planBinary: "plans/q01.bin"
    planJson: "plans/q01.json"
    inputTables:
      - name: "customer"
        file: "data/customer.csv"
        rows: 1000
      - name: "date_dim"
        file: "data/date_dim.csv"
        rows: 73049
      - name: "store"
        file: "data/store.csv"
        rows: 1
      - name: "store_returns"
        file: "data/store_returns.csv"
        rows: 2810
    expectedOutput: "expected/q01.csv"

  - id: "q02"
    description: "Web Sales Analysis - Analyze web and catalog sales patterns by week"
