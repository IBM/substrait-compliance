[package]
name = "datafusion-substrait-compliance"
version = "0.1.1"
edition = "2021"
authors = ["Substrait Compliance Contributors"]
description = "DataFusion reference implementation for Substrait compliance testing"
license = "Apache-2.0"
repository = "https://github.com/IBM/substrait-compliance"

[dependencies]
datafusion = "54.1"
datafusion-substrait = "54.1"
substrait = "0.64"
prost = "0.14"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
criterion = "0.5"

[[bin]]
name = "datafusion-compliance-example"
path = "src/main.rs"

[lib]
name = "datafusion_substrait_compliance"
path = "src/lib.rs"
