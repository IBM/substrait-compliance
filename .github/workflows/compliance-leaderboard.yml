name: Compliance Leaderboard

on:
  schedule:
    # Run weekly on Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
  repository_dispatch:
    types: [compliance-report-submitted]
  # Publish when a leaderboard submission is merged (submissions/README.md)
  push:
    branches: [main]
    paths:
      - 'submissions/**'
      - 'test-suites/registry.json'
  # Publish as soon as an engine's compliance run on main finishes
  workflow_run:
    workflows: ["DuckDB Substrait Compliance CI", "DataFusion Compliance"]
    types: [completed]
    branches: [main]

# Several triggers often fire together (a merge, then each engine's run finishing).
# A publish that has started always finishes; a newer run waits and replaces any
# run still waiting, so the last one published has the latest entries.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect-reports:
    name: Collect Compliance Reports
    runs-on: ubuntu-latest
    # On workflow_run, only publish results from a successful run
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install the submission tools
        run: pip install -e sdk/python "jsonschema==4.23.0"

      - name: Create reports directory
        run: mkdir -p compliance-reports

      # One entry per engine: the leaderboard-report artifact of that engine's latest
      # successful run on main. Demo engines are not published here (see demo/).
      - name: Download the latest entry of each engine
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for spec in duckdb-compliance.yml:duckdb-leaderboard-report \
                      datafusion-compliance.yml:datafusion-leaderboard-report; do
            workflow=${spec%%:*}; artifact=${spec#*:}
            RUN_ID=$(gh run list --workflow "$workflow" --branch main --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
            if [ -n "$RUN_ID" ] && gh run download "$RUN_ID" --name "$artifact" --dir compliance-reports; then
              echo "✅ $artifact from $workflow run $RUN_ID"
            else
              echo "::warning::No $artifact from a successful $workflow run on main; that engine is left off"
            fi
          done
          ls -l compliance-reports

      # Engines run by their own teams: the latest merged submission of each, checked
      # again and scored with the same rules (scripts/collect_submissions.py).
      - name: Collect merged submissions
        run: |
          python scripts/collect_submissions.py --output compliance-reports
          if [ -z "$(ls compliance-reports/*.json 2>/dev/null)" ]; then
            echo "❌ No engine results (CI runs on main or merged submissions); nothing real to publish"
            exit 1
          fi
          ls -l compliance-reports

      - name: Upload collected reports
        uses: actions/upload-artifact@v7
        with:
          name: compliance-reports
          path: compliance-reports/

  generate-leaderboard:
    name: Generate Leaderboard
    runs-on: ubuntu-latest
    needs: collect-reports
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Download compliance reports
        uses: actions/download-artifact@v8
        with:
          name: compliance-reports
          path: compliance-reports
      
      - name: Generate leaderboard
        run: |
          python scripts/generate_leaderboard.py \
            --input compliance-reports \
            --output docs/leaderboard.md \
            --format all
          cat docs/leaderboard.md >> "$GITHUB_STEP_SUMMARY"
      
      - name: Upload leaderboard
        uses: actions/upload-artifact@v7
        with:
          name: leaderboard
          path: |
            docs/leaderboard.md
            docs/leaderboard.json
            docs/leaderboard.html

  deploy-to-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: generate-leaderboard
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - name: Download leaderboard
        uses: actions/download-artifact@v8
        with:
          name: leaderboard
          path: docs

      - name: Setup Pages
        uses: actions/configure-pages@v6
      
      # The page is generated by scripts/generate_leaderboard.py (--format all) from the
      # same data as leaderboard.md, so the site and the Markdown never disagree.
      - name: Build site
        run: |
          mkdir -p _site
          cp docs/leaderboard.html _site/index.html
          cp docs/leaderboard.md _site/leaderboard.md
          cp docs/leaderboard.json _site/leaderboard.json
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [generate-leaderboard]
    if: always() && needs.generate-leaderboard.result == 'success'
    
    steps:
      - name: Download leaderboard
        uses: actions/download-artifact@v8
        with:
          name: leaderboard
          path: docs
      
      - name: Generate notification
        run: |
          echo "## 📊 Compliance Leaderboard Updated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f docs/leaderboard.json ]; then
            python << 'EOF'
          import json
          import os
          
          with open('docs/leaderboard.json', 'r') as f:
              data = json.load(f)
          
          summary = f"**Engines ranked**: {data['totalEngines']}\n\n"
          summary += "### Top 3 Engines (overall = average of functions and queries)\n\n"
          
          for i, engine in enumerate(data['engines'][:3], 1):
              emoji = '🥇' if i == 1 else '🥈' if i == 2 else '🥉'
              cats = engine.get('categories') or {}
              detail = ", ".join(f"{c} {(cats.get(c) or {}).get('passRate')}%" for c in ('functions', 'queries'))
              summary += f"{emoji} **{engine['engineName']}** {engine['engineVersion']}: {engine['passRate']:.1f}% ({detail})\n"
          
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(summary)
          EOF
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View Full Leaderboard](https://IBM.github.io/substrait-compliance/)" >> $GITHUB_STEP_SUMMARY

  summary:
    name: Workflow Summary
    runs-on: ubuntu-latest
    needs: [collect-reports, generate-leaderboard, deploy-to-pages]
    if: always()
    
    steps:
      - name: Generate summary
        run: |
          echo "## 🏆 Leaderboard Workflow Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Step | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Collect Reports | ${{ needs.collect-reports.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Generate Leaderboard | ${{ needs.generate-leaderboard.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy to Pages | ${{ needs.deploy-to-pages.result == 'success' && '✅ Success' || needs.deploy-to-pages.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

