name: DuckDB Substrait Compliance CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'examples/duckdb-java/**'
      - 'sdk/java/**'
      - 'test-suites/**'
      - 'test-suites-enhanced/**'
      - '.github/workflows/duckdb-compliance.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'examples/duckdb-java/**'
      - 'sdk/java/**'
      - 'test-suites/**'
      - 'test-suites-enhanced/**'
      - '.github/workflows/duckdb-compliance.yml'
  schedule:
    # Run weekly on Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      compliance_threshold:
        description: 'Minimum compliance pass rate percentage (0-100)'
        required: false
        default: '45'
      engine_name:
        description: 'Target engine name'
        required: false
        default: 'DuckDB'
      engine_version:
        description: 'Target engine version'
        required: false
        default: '1.2.0'

env:
  ENGINE_NAME: ${{ github.event.inputs.engine_name || 'DuckDB' }}
  ENGINE_VERSION: ${{ github.event.inputs.engine_version || '1.2.0' }}
  COMPLIANCE_SDK_VERSION: "0.1.1"
  COMPLIANCE_THRESHOLD: ${{ github.event.inputs.compliance_threshold || 45 }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Build Framework SDK and Prepare Test Suites
  # ============================================================================
  build-framework:
    name: Build Compliance SDK & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x sdk/java/gradlew

      - name: Build Java SDK Fat Jar
        run: |
          cd sdk/java
          ./gradlew shadowJar --no-daemon -q

      - name: Package Test Suites and Fat Jar
        run: |
          mkdir -p compliance-assets/libs
          cp sdk/java/build/libs/substrait-compliance-*-all.jar compliance-assets/libs/substrait-compliance-all.jar
          cp -r test-suites compliance-assets/test-suites
          if [ -d "test-suites-enhanced" ]; then
            cp -r test-suites-enhanced compliance-assets/test-suites-enhanced
          fi

      - name: Upload Compliance Assets
        uses: actions/upload-artifact@v4
        with:
          name: compliance-assets
          path: compliance-assets/

  # ============================================================================
  # 2. Implement & Execute Engine Compliance Tests
  # ============================================================================
  run-compliance:
    name: Run Compliance Tests (${{ inputs.engine_name || 'DuckDB' }})
    runs-on: ubuntu-latest
    needs: build-framework
    outputs:
      pass-rate: ${{ steps.parse-results.outputs.pass-rate }}
      passed: ${{ steps.parse-results.outputs.passed }}
      total: ${{ steps.parse-results.outputs.total }}
      failed: ${{ steps.parse-results.outputs.failed }}
      skipped: ${{ steps.parse-results.outputs.skipped }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Compliance Assets
        uses: actions/download-artifact@v4
        with:
          name: compliance-assets
          path: compliance-assets

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'sdk/python/pyproject.toml'

      - name: Install Python SDK & dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e sdk/python

      - name: Prepare DuckDB JDBC Driver and Compile Example
        run: |
          chmod +x examples/duckdb-java/download-deps.sh
          examples/duckdb-java/download-deps.sh
          examples/duckdb-java/compile.sh --no-sdk

      - name: Run Engine Smoke Test (Dry Run)
        run: |
          FAT_JAR="compliance-assets/libs/substrait-compliance-all.jar"
          DUCKDB_JAR="examples/duckdb-java/lib/duckdb_jdbc-1.3.1.0.jar"
          java -cp "examples/duckdb-java/build:$FAT_JAR:$DUCKDB_JAR" \
            io.substrait.example.DuckDBComplianceExample --dry-run

      - name: Run Test Suites & Generate Compliance Reports
        run: |
          mkdir -p output/reports
          FAT_JAR="compliance-assets/libs/substrait-compliance-all.jar"
          DUCKDB_JAR="examples/duckdb-java/lib/duckdb_jdbc-1.3.1.0.jar"

          # 1. Run DuckDB Java compliance runner on TPC-H test suite
          java -cp "examples/duckdb-java/build:$FAT_JAR:$DUCKDB_JAR" \
            io.substrait.example.DuckDBComplianceExample \
            --test-suite compliance-assets/test-suites/tpch/metadata.yaml \
            --output-report output/reports/duckdb-tpch-report.json

          # 2. Run Function compliance test runner
          python3 demo/runner/function_test_demo.py

          # 3. Copy generated demo reports for DuckDB into output/reports
          cp demo/output/DuckDB_function_tests.json output/reports/ || true
          cp demo/output/duckdb-report.json output/reports/ || true
          cp demo/output/function_tests_summary.json output/reports/ || true

      - name: Parse Compliance Results
        id: parse-results
        run: |
          REPORT_FILE="output/reports/DuckDB_function_tests.json"
          if [ ! -f "$REPORT_FILE" ]; then
            REPORT_FILE="output/reports/duckdb-report.json"
          fi

          if [ ! -f "$REPORT_FILE" ]; then
            echo "❌ Report file not found at $REPORT_FILE"
            exit 1
          fi

          PASS_RATE=$(jq -r '.overallPassRate // .passRate // .summary.passRate // empty' "$REPORT_FILE")
          PASSED=$(jq -r '.totalPassed // .passed // .summary.passed // empty' "$REPORT_FILE")
          TOTAL=$(jq -r '.totalTests // .summary.totalTests // empty' "$REPORT_FILE")
          FAILED=$(jq -r '.totalFailed // .failed // .summary.failed // 0' "$REPORT_FILE")
          SKIPPED=$(jq -r '.totalSkipped // .skipped // .summary.skipped // 0' "$REPORT_FILE")

          if [ -z "$PASS_RATE" ] || [ -z "$PASSED" ] || [ -z "$TOTAL" ]; then
            echo "❌ Could not parse valid compliance metrics from $REPORT_FILE"
            exit 1
          fi

          echo "pass-rate=$PASS_RATE" >> $GITHUB_OUTPUT
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "skipped=$SKIPPED" >> $GITHUB_OUTPUT

          echo "📊 ${{ env.ENGINE_NAME }} Compliance Summary:"
          echo "   Pass Rate: $PASS_RATE%"
          echo "   Passed:    $PASSED / $TOTAL"
          echo "   Failed:    $FAILED"
          echo "   Skipped:   $SKIPPED"

      - name: Upload Engine Compliance Reports
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-compliance-reports
          path: output/reports/

      - name: Check Compliance Quality Threshold
        run: |
          PASS_RATE=${{ steps.parse-results.outputs.pass-rate }}
          THRESHOLD=${{ env.COMPLIANCE_THRESHOLD }}
          echo "Evaluating pass rate ($PASS_RATE%) against threshold ($THRESHOLD%)..."
          if (( $(echo "$PASS_RATE < $THRESHOLD" | bc -l) )); then
            echo "❌ Compliance rate $PASS_RATE% is below threshold $THRESHOLD%"
            exit 1
          fi
          echo "✅ Compliance threshold met!"

  # ============================================================================
  # 3. Update Dashboard and Leaderboard Data
  # ============================================================================
  update-dashboard:
    name: Update Dashboard & Leaderboard
    runs-on: ubuntu-latest
    needs: run-compliance
    if: always()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Engine Compliance Reports
        uses: actions/download-artifact@v4
        with:
          name: duckdb-compliance-reports
          path: output/reports

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate Leaderboard & Dashboard JSON
        run: |
          mkdir -p demo/dashboard/data
          # Run leaderboard aggregation script across reports
          INPUT_DIR="output/reports"
          if [ ! -d "$INPUT_DIR" ] || [ -z "$(ls -A "$INPUT_DIR"/*.json 2>/dev/null)" ]; then
            INPUT_DIR="demo/output"
          fi
          python3 scripts/generate_leaderboard.py \
            --input "$INPUT_DIR" \
            --output demo/dashboard/data/leaderboard.json \
            --format both

          # Update docs leaderboard as well
          mkdir -p docs
          cp demo/dashboard/data/leaderboard.md docs/leaderboard.md 2>/dev/null || true

      - name: Upload Updated Dashboard Data
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-data
          path: demo/dashboard/data/

  # ============================================================================
  # 4. Generate GitHub Summary
  # ============================================================================
  summary:
    name: Compliance CI Summary
    runs-on: ubuntu-latest
    needs: [run-compliance, update-dashboard]
    if: always()
    steps:
      - name: Post Job Summary
        run: |
          STATUS="${{ needs.run-compliance.result == 'success' && '✅ PASSED' || '❌ FAILED' }}"
          PASS_RATE="${{ needs.run-compliance.outputs.pass-rate || 'N/A' }}"
          PASSED="${{ needs.run-compliance.outputs.passed || '0' }}"
          TOTAL="${{ needs.run-compliance.outputs.total || '0' }}"
          FAILED="${{ needs.run-compliance.outputs.failed || '0' }}"
          SKIPPED="${{ needs.run-compliance.outputs.skipped || '0' }}"

          cat << EOF >> $GITHUB_STEP_SUMMARY
          # 🦆 Substrait Compliance Report: ${{ env.ENGINE_NAME }}

          ## Overall Status: $STATUS

          | Metric | Value |
          |---|---|
          | **Engine** | \`${{ env.ENGINE_NAME }}\` |
          | **Engine Version** | \`${{ env.ENGINE_VERSION }}\` |
          | **Framework SDK** | \`${{ env.COMPLIANCE_SDK_VERSION }}\` |
          | **Pass Rate** | **$PASS_RATE%** |
          | **Passed Tests** | $PASSED / $TOTAL |
          | **Failed Tests** | $FAILED |
          | **Skipped Tests** | $SKIPPED |
          | **Threshold** | ${{ env.COMPLIANCE_THRESHOLD }}% |

          ---
          *Report generated automatically by Substrait Compliance CI workflow.*
          EOF
