name: DuckDB Substrait Compliance CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'examples/duckdb-java/**'
      - 'sdk/java/**'
      - 'test-suites/**'
      - 'test-suites-enhanced/**'
      - 'sdk/python/**'
      - 'scripts/run_function_compliance.py'
      - 'scripts/function_sql.py'
      - 'scripts/function_plans.py'
      - 'scripts/validate_function_tests.py'
      - 'scripts/combine_engine_reports.py'
      - 'scripts/generate_leaderboard.py'
      - '.github/workflows/duckdb-compliance.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'examples/duckdb-java/**'
      - 'sdk/java/**'
      - 'test-suites/**'
      - 'test-suites-enhanced/**'
      - 'sdk/python/**'
      - 'scripts/run_function_compliance.py'
      - 'scripts/function_sql.py'
      - 'scripts/function_plans.py'
      - 'scripts/validate_function_tests.py'
      - 'scripts/combine_engine_reports.py'
      - 'scripts/generate_leaderboard.py'
      - '.github/workflows/duckdb-compliance.yml'
  schedule:
    # Run weekly on Monday at 02:00 UTC
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      compliance_threshold:
        description: 'Minimum combined pass rate percentage (0-100)'
        required: false
        default: '80'

env:
  # Python package and JDBC driver are pinned to the same DuckDB release so both
  # suites measure one engine version.
  DUCKDB_PY_VERSION: "1.5.6"
  DUCKDB_JDBC_VERSION: "1.5.6.0"
  COMPLIANCE_SDK_VERSION: "0.1.1"
  # Function definitions the functions-substrait-0.107 suite is validated against
  SUBSTRAIT_EXTENSIONS_VERSION: "0.107.0"
  COMPLIANCE_THRESHOLD: ${{ inputs.compliance_threshold || '80' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ============================================================================
  # 1. Build Framework SDK and Prepare Test Suites
  # ============================================================================
  build-framework:
    name: Build Compliance SDK & Assets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x sdk/java/gradlew

      - name: Build Java SDK Fat Jar
        run: |
          cd sdk/java
          ./gradlew shadowJar --no-daemon -q

      - name: Package Test Suites and Fat Jar
        run: |
          mkdir -p compliance-assets/libs
          cp sdk/java/build/libs/substrait-compliance-*-all.jar compliance-assets/libs/substrait-compliance-all.jar
          cp -r test-suites compliance-assets/test-suites
          if [ -d "test-suites-enhanced" ]; then
            cp -r test-suites-enhanced compliance-assets/test-suites-enhanced
          fi

      - name: Upload Compliance Assets
        uses: actions/upload-artifact@v4
        with:
          name: compliance-assets
          path: compliance-assets/

  # ============================================================================
  # 2. Implement & Execute Engine Compliance Tests
  # ============================================================================
  run-compliance:
    name: Run DuckDB Compliance Tests
    runs-on: ubuntu-latest
    needs: build-framework
    outputs:
      pass-rate: ${{ steps.parse-results.outputs.pass-rate }}
      passed: ${{ steps.parse-results.outputs.passed }}
      total: ${{ steps.parse-results.outputs.total }}
      failed: ${{ steps.parse-results.outputs.failed }}
      skipped: ${{ steps.parse-results.outputs.skipped }}
      engine-version: ${{ steps.parse-results.outputs.engine-version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Compliance Assets
        uses: actions/download-artifact@v4
        with:
          name: compliance-assets
          path: compliance-assets

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'sdk/python/pyproject.toml'

      - name: Install Python SDK & DuckDB
        run: |
          python -m pip install --upgrade pip
          pip install -e sdk/python "duckdb==${DUCKDB_PY_VERSION}" \
            "substrait-extensions==${SUBSTRAIT_EXTENSIONS_VERSION}" \
            "substrait-protobuf==${SUBSTRAIT_EXTENSIONS_VERSION}"

      - name: Prepare DuckDB JDBC Driver and Compile Example
        run: |
          chmod +x examples/duckdb-java/download-deps.sh
          examples/duckdb-java/download-deps.sh "$DUCKDB_JDBC_VERSION"
          examples/duckdb-java/compile.sh --no-sdk

      - name: Run Engine Smoke Test (Dry Run)
        env:
          COMPLIANCE_REQUIRE_SUBSTRAIT_EXTENSION: "true"
        run: |
          FAT_JAR="compliance-assets/libs/substrait-compliance-all.jar"
          DUCKDB_JAR="examples/duckdb-java/lib/duckdb_jdbc-${DUCKDB_JDBC_VERSION}.jar"
          java -cp "examples/duckdb-java/build:$FAT_JAR:$DUCKDB_JAR" \
            io.substrait.example.DuckDBComplianceExample --dry-run

      - name: Run TPC-H plans on DuckDB (Java, Substrait extension)
        env:
          COMPLIANCE_REQUIRE_SUBSTRAIT_EXTENSION: "true"
        run: |
          mkdir -p output/reports
          FAT_JAR="compliance-assets/libs/substrait-compliance-all.jar"
          DUCKDB_JAR="examples/duckdb-java/lib/duckdb_jdbc-${DUCKDB_JDBC_VERSION}.jar"
          java -cp "examples/duckdb-java/build:$FAT_JAR:$DUCKDB_JAR" \
            io.substrait.example.DuckDBComplianceExample \
            --test-suite compliance-assets/test-suites/tpch/metadata.yaml \
            --output-report output/reports/duckdb-tpch.json

      # Same queries, original plans in the Substrait 0.81 encoding (fields since
      # removed from the spec). Measures whether the engine still accepts older plans.
      - name: Run TPC-H plans in the Substrait 0.81 encoding
        env:
          COMPLIANCE_REQUIRE_SUBSTRAIT_EXTENSION: "true"
        run: |
          FAT_JAR="compliance-assets/libs/substrait-compliance-all.jar"
          DUCKDB_JAR="examples/duckdb-java/lib/duckdb_jdbc-${DUCKDB_JDBC_VERSION}.jar"
          java -cp "examples/duckdb-java/build:$FAT_JAR:$DUCKDB_JAR" \
            io.substrait.example.DuckDBComplianceExample \
            --test-suite compliance-assets/test-suites/tpch/metadata-substrait-0.81.yaml \
            --output-report output/reports/duckdb-tpch-substrait-0.81.json

      # The scored function suite: upstream Substrait cases + verified legacy cases,
      # validated against the extension YAMLs first.
      - name: Validate functions-substrait-0.107 against the extension YAMLs
        run: |
          python scripts/validate_function_tests.py \
            compliance-assets/test-suites/functions-substrait-0.107 \
            --substrait-version "${SUBSTRAIT_EXTENSIONS_VERSION%.*}"

      # Scored: every case is a Substrait plan run through DuckDB's substrait extension
      # (from_substrait). The engine runs in a child process, so a plan that crashes the
      # extension fails that case and the run continues.
      - name: Run functions-substrait-0.107 as Substrait plans on DuckDB
        run: |
          python scripts/run_function_compliance.py --mode plan \
            --suites-dir compliance-assets/test-suites/functions-substrait-0.107/upstream \
            --suite-name functions-substrait-0.107 \
            --output output/reports/duckdb-functions-substrait-0.107.json
          python scripts/run_function_compliance.py --mode plan \
            --suites-dir compliance-assets/test-suites/functions-substrait-0.107/extended \
            --suite-name functions-substrait-0.107-extended \
            --output output/reports/duckdb-functions-substrait-0.107-extended.json

      # Not scored: the same cases translated to DuckDB SQL (the engine's SQL functions,
      # without its Substrait consumer), shown for comparison as the *-sql rows.
      - name: Run functions-substrait-0.107 as SQL on DuckDB
        run: |
          python scripts/run_function_compliance.py \
            --suites-dir compliance-assets/test-suites/functions-substrait-0.107/upstream \
            --suite-name functions-substrait-0.107-sql \
            --output output/reports/duckdb-functions-substrait-0.107-sql.json
          python scripts/run_function_compliance.py \
            --suites-dir compliance-assets/test-suites/functions-substrait-0.107/extended \
            --suite-name functions-substrait-0.107-extended-sql \
            --output output/reports/duckdb-functions-substrait-0.107-extended-sql.json

      # The legacy suite (test-suites/functions) still runs and is shown on the
      # leaderboard as functions-legacy, but is not scored.
      - name: Run legacy function suite on DuckDB (Python)
        run: |
          python scripts/run_function_compliance.py \
            --suites-dir compliance-assets/test-suites/functions \
            --suite-name functions-legacy \
            --output output/reports/duckdb-functions-legacy.json

      - name: Combine into leaderboard entry
        run: |
          python scripts/combine_engine_reports.py --engine DuckDB \
            --suite functions-substrait-0.107=output/reports/duckdb-functions-substrait-0.107.json \
            --suite functions-substrait-0.107-extended=output/reports/duckdb-functions-substrait-0.107-extended.json \
            --suite tpch=output/reports/duckdb-tpch.json \
            --suite tpch-substrait-0.81=output/reports/duckdb-tpch-substrait-0.81.json \
            --informational functions-substrait-0.107-sql=output/reports/duckdb-functions-substrait-0.107-sql.json \
            --informational functions-substrait-0.107-extended-sql=output/reports/duckdb-functions-substrait-0.107-extended-sql.json \
            --informational functions-legacy=output/reports/duckdb-functions-legacy.json \
            --output output/leaderboard/duckdb.json

      - name: Parse Compliance Results
        id: parse-results
        run: |
          REPORT_FILE="output/leaderboard/duckdb.json"
          {
            echo "pass-rate=$(jq -r '.passRate' "$REPORT_FILE")"
            echo "passed=$(jq -r '.passed' "$REPORT_FILE")"
            echo "total=$(jq -r '.totalTests' "$REPORT_FILE")"
            echo "failed=$(jq -r '.failed' "$REPORT_FILE")"
            echo "skipped=$(jq -r '.skipped' "$REPORT_FILE")"
            echo "engine-version=$(jq -r '.engineVersion' "$REPORT_FILE")"
          } >> "$GITHUB_OUTPUT"
          jq -r '"📊 DuckDB \(.engineVersion): \(.passRate)% (\(.passed) passed, \(.failed) failed, \(.skipped) skipped)"' "$REPORT_FILE"
          jq -r '.suites | to_entries[] | "   \(.key): \(.value.passRate)% (\(.value.passed) passed, \(.value.failed) failed, \(.value.skipped) skipped)"' "$REPORT_FILE"

      - name: Upload detailed reports
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-compliance-reports
          path: output/reports/

      # Consumed by compliance-leaderboard.yml (workflow_run trigger / latest successful run)
      - name: Upload leaderboard entry
        uses: actions/upload-artifact@v4
        with:
          name: duckdb-leaderboard-report
          path: output/leaderboard/duckdb.json
          retention-days: 90

      - name: Check Compliance Quality Threshold
        env:
          PASS_RATE: ${{ steps.parse-results.outputs.pass-rate }}
        run: |
          echo "Evaluating pass rate ($PASS_RATE%) against threshold ($COMPLIANCE_THRESHOLD%)..."
          if (( $(echo "$PASS_RATE < $COMPLIANCE_THRESHOLD" | bc -l) )); then
            echo "❌ Compliance rate $PASS_RATE% is below threshold $COMPLIANCE_THRESHOLD%"
            exit 1
          fi
          echo "✅ Compliance threshold met!"

  # ============================================================================
  # 3. Leaderboard preview (publishing happens in compliance-leaderboard.yml)
  # ============================================================================
  leaderboard-preview:
    name: Leaderboard Preview
    runs-on: ubuntu-latest
    needs: run-compliance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download leaderboard entry
        uses: actions/download-artifact@v4
        with:
          name: duckdb-leaderboard-report
          path: output/leaderboard

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate leaderboard preview
        run: |
          python scripts/generate_leaderboard.py \
            --input output/leaderboard \
            --output preview/leaderboard.md \
            --format both
          cat preview/leaderboard.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload leaderboard preview
        uses: actions/upload-artifact@v4
        with:
          name: leaderboard-preview
          path: preview/

  # ============================================================================
  # 4. Generate GitHub Summary
  # ============================================================================
  summary:
    name: Compliance CI Summary
    runs-on: ubuntu-latest
    needs: [run-compliance, leaderboard-preview]
    if: always()
    steps:
      - name: Post Job Summary
        env:
          STATUS: ${{ needs.run-compliance.result == 'success' && '✅ PASSED' || '❌ FAILED' }}
          PASS_RATE: ${{ needs.run-compliance.outputs.pass-rate || 'N/A' }}
          PASSED: ${{ needs.run-compliance.outputs.passed || '0' }}
          TOTAL: ${{ needs.run-compliance.outputs.total || '0' }}
          FAILED: ${{ needs.run-compliance.outputs.failed || '0' }}
          SKIPPED: ${{ needs.run-compliance.outputs.skipped || '0' }}
          ENGINE_VERSION: ${{ needs.run-compliance.outputs.engine-version || 'unknown' }}
        run: |
          cat << EOF >> "$GITHUB_STEP_SUMMARY"
          # 🦆 Substrait Compliance Report: DuckDB

          ## Overall Status: $STATUS

          | Metric | Value |
          |---|---|
          | **Engine** | \`DuckDB\` |
          | **Engine Version** | \`$ENGINE_VERSION\` |
          | **Framework SDK** | \`$COMPLIANCE_SDK_VERSION\` |
          | **Pass Rate** | **$PASS_RATE%** (passed ÷ executed; skipped excluded) |
          | **Passed Tests** | $PASSED / $TOTAL |
          | **Failed Tests** | $FAILED |
          | **Skipped Tests** | $SKIPPED |
          | **Threshold** | $COMPLIANCE_THRESHOLD% |

          EOF

      - name: Download leaderboard entry
        if: needs.run-compliance.outputs.pass-rate != ''
        uses: actions/download-artifact@v4
        with:
          name: duckdb-leaderboard-report
          path: leaderboard

      - name: Post per-suite results
        if: needs.run-compliance.outputs.pass-rate != ''
        run: |
          {
            echo ""
            echo "## Results by suite"
            echo ""
            echo "| Suite | Pass Rate | Passed | Failed | Skipped | Total |"
            echo "|---|---|---|---|---|---|"
            jq -r '.suites | to_entries[] | "| \(.key)\(if .value.informational then " _(not scored)_" else "" end) | \(if .value.passRate == null then "n/a" else "\(.value.passRate)%" end) | \(.value.passed) | \(.value.failed) | \(.value.skipped) | \(.value.totalTests) |"' leaderboard/duckdb.json
            echo ""
            echo "Per-test reasons for every failure and skip are in the \`duckdb-compliance-reports\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"
