name: DataFusion Compliance

# Runs Apache DataFusion (Python bindings) on
#   * the TPC-H plans, through DataFusion's own Substrait consumer, in the current
#     (0.107.0) and the legacy (0.81) plan encodings - scored with the same rules
#     as the Java runner uses for DuckDB (scripts/run_plan_compliance.py);
#   * the current-format function suite (test-suites/functions-substrait-0.107), as
#     Substrait plans through the same consumer, and as SQL for comparison.
# The combined entry (output/leaderboard/datafusion.json) is published on the
# leaderboard by compliance-leaderboard.yml, scored the same way as DuckDB's.

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'test-suites/functions-substrait-0.107/**'
      - 'test-suites/tpch/**'
      - 'scripts/run_plan_compliance.py'
      - 'sdk/python/**'
      - 'scripts/run_function_compliance.py'
      - 'scripts/function_sql.py'
      - 'scripts/function_plans.py'
      - 'scripts/validate_function_tests.py'
      - 'scripts/combine_engine_reports.py'
      - 'scripts/check_compliance_regression.py'
      - '.github/workflows/datafusion-compliance.yml'
  pull_request:
    branches: [ main, develop ]
    # labeled: adding compliance-regression-ok re-runs the check
    types: [ opened, synchronize, reopened, labeled ]
    paths:
      - 'test-suites/functions-substrait-0.107/**'
      - 'test-suites/tpch/**'
      - 'scripts/run_plan_compliance.py'
      - 'sdk/python/**'
      - 'scripts/run_function_compliance.py'
      - 'scripts/function_sql.py'
      - 'scripts/function_plans.py'
      - 'scripts/validate_function_tests.py'
      - 'scripts/combine_engine_reports.py'
      - 'scripts/check_compliance_regression.py'
      - '.github/workflows/datafusion-compliance.yml'
  schedule:
    # Weekly on Monday at 02:30 UTC, after the DuckDB run
    - cron: '30 2 * * 1'
  workflow_dispatch:
    inputs:
      max_regression:
        description: 'Largest allowed drop from the last published result, in percentage points'
        required: false
        default: '1.0'
      allow_regression:
        description: 'Report a regression without failing (for an intentional change)'
        type: boolean
        required: false
        default: false

env:
  DATAFUSION_PY_VERSION: "55.0.0"
  SUBSTRAIT_EXTENSIONS_VERSION: "0.107.0"
  MAX_REGRESSION: ${{ inputs.max_regression || '1.0' }}
  ALLOW_REGRESSION: ${{ inputs.allow_regression || contains(github.event.pull_request.labels.*.name, 'compliance-regression-ok') }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-compliance:
    name: Run TPC-H and function suites on DataFusion
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # download the last published entry for the regression check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'sdk/python/pyproject.toml'

      - name: Install Python SDK & DataFusion
        run: |
          python -m pip install --upgrade pip
          pip install -e sdk/python "datafusion==${DATAFUSION_PY_VERSION}" \
            "substrait-extensions==${SUBSTRAIT_EXTENSIONS_VERSION}" \
            "substrait-protobuf==${SUBSTRAIT_EXTENSIONS_VERSION}"

      - name: Run TPC-H plans on DataFusion (Substrait consumer)
        run: |
          mkdir -p output/reports
          python scripts/run_plan_compliance.py --engine datafusion \
            --test-suite test-suites/tpch/metadata.yaml \
            --output output/reports/datafusion-tpch.json
          python scripts/run_plan_compliance.py --engine datafusion \
            --test-suite test-suites/tpch/metadata-substrait-0.81.yaml \
            --output output/reports/datafusion-tpch-substrait-0.81.json

      - name: Validate functions-substrait-0.107 against the extension YAMLs
        run: |
          python scripts/validate_function_tests.py test-suites/functions-substrait-0.107 \
            --substrait-version "${SUBSTRAIT_EXTENSIONS_VERSION%.*}"

      - name: Run functions-substrait-0.107 as Substrait plans on DataFusion
        run: |
          mkdir -p output/reports
          python scripts/run_function_compliance.py --engine datafusion --mode plan \
            --suites-dir test-suites/functions-substrait-0.107/upstream \
            --suite-name functions-substrait-0.107 \
            --output output/reports/datafusion-functions-substrait-0.107.json
          python scripts/run_function_compliance.py --engine datafusion --mode plan \
            --suites-dir test-suites/functions-substrait-0.107/extended \
            --suite-name functions-substrait-0.107-extended \
            --output output/reports/datafusion-functions-substrait-0.107-extended.json

      - name: Run functions-substrait-0.107 as SQL on DataFusion
        run: |
          python scripts/run_function_compliance.py --engine datafusion \
            --suites-dir test-suites/functions-substrait-0.107/upstream \
            --suite-name functions-substrait-0.107-sql \
            --output output/reports/datafusion-functions-substrait-0.107-sql.json
          python scripts/run_function_compliance.py --engine datafusion \
            --suites-dir test-suites/functions-substrait-0.107/extended \
            --suite-name functions-substrait-0.107-extended-sql \
            --output output/reports/datafusion-functions-substrait-0.107-extended-sql.json

      - name: Combine into leaderboard entry
        run: |
          python scripts/combine_engine_reports.py --engine DataFusion \
            --consumer "datafusion.substrait ${DATAFUSION_PY_VERSION}" \
            --functions functions-substrait-0.107=output/reports/datafusion-functions-substrait-0.107.json \
            --queries tpch=output/reports/datafusion-tpch.json \
            --reference functions-substrait-0.107-sql=output/reports/datafusion-functions-substrait-0.107-sql.json \
            --reference functions-substrait-0.107-extended=output/reports/datafusion-functions-substrait-0.107-extended.json \
            --reference functions-substrait-0.107-extended-sql=output/reports/datafusion-functions-substrait-0.107-extended-sql.json \
            --reference tpch-substrait-0.81=output/reports/datafusion-tpch-substrait-0.81.json \
            --output output/leaderboard/datafusion.json

      - name: Post results
        if: always()
        run: |
          {
            echo "## DataFusion ${DATAFUSION_PY_VERSION}"
            echo ""
            if [ -f output/leaderboard/datafusion.json ]; then
              jq -r '"**Overall \(.passRate)%**: functions \(.categories.functions.passRate)%, queries \(.categories.queries.passRate)%"' output/leaderboard/datafusion.json
              echo ""
            fi
            echo "| Suite | Pass Rate | Passed | Failed | Skipped | Total |"
            echo "|---|---|---|---|---|---|"
            for f in output/reports/datafusion-*.json; do
              [ -f "$f" ] || continue
              jq -r '"| \(.suite // .testSuiteName) | \(if .passRate == null then "n/a" else "\(.passRate)%" end) | \(.passed) | \(.failed) | \(.skipped) | \(.totalTests) |"' "$f"
            done
            echo ""
            echo "### TPC-H failures"
            echo ""
            for f in output/reports/datafusion-tpch*.json; do
              [ -f "$f" ] || continue
              jq -r '.testSuiteName as $s | .testResults[] | select(.status != "PASSED") | "- \($s) \(.testId): \(.message // "" | .[0:200])"' "$f"
            done
            echo ""
            echo "Per-test reasons for every failure and skip are in the \`datafusion-compliance-reports\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datafusion-compliance-reports
          path: output/reports/
          retention-days: 30

      # Consumed by compliance-leaderboard.yml (workflow_run trigger / latest successful run)
      - name: Upload leaderboard entry
        uses: actions/upload-artifact@v4
        with:
          name: datafusion-leaderboard-report
          path: output/leaderboard/datafusion.json
          retention-days: 90

      - name: Download the last published entry
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          RUN_ID=$(gh run list --workflow datafusion-compliance.yml --branch main --status success \
            --limit 1 --json databaseId --jq '.[0].databaseId // empty' || true)
          if [ -n "$RUN_ID" ] && gh run download "$RUN_ID" --name datafusion-leaderboard-report --dir baseline; then
            echo "BASELINE_DESC=the last published result (run $RUN_ID)" >> "$GITHUB_ENV"
          else
            echo "No published entry found; the regression check will be skipped."
          fi

      - name: Check for a compliance regression
        run: |
          ARGS=()
          if [ "$ALLOW_REGRESSION" = "true" ]; then ARGS+=(--allow-regression); fi
          python scripts/check_compliance_regression.py \
            --current output/leaderboard/datafusion.json \
            --baseline baseline/datafusion.json \
            --baseline-desc "${BASELINE_DESC:-the last published result}" \
            --max-drop "$MAX_REGRESSION" "${ARGS[@]}"
