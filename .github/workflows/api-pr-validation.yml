name: API PR Validation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'api/**'
      - 'sdk/java/**'
      - '.github/workflows/api-pr-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for better analysis
      
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'
      
      - name: Grant execute permission
        run: |
          chmod +x gradlew
          chmod +x api/gradlew
      
      - name: Build SDK fat jar (required by api/ build)
        # api/build.gradle resolves the SDK via fileTree(dir: "${rootDir}/libs").
        # Build the fat jar here and stage it so the API compile step finds it.
        run: |
          ./gradlew :sdk:java:shadowJar --no-daemon
          mkdir -p api/libs
          cp sdk/java/build/libs/*-all.jar api/libs/
      
      - name: Run tests
        run: |
          cd api
          ./gradlew test --no-daemon
      
      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: api/build/test-results/
      
# Made with Bob
