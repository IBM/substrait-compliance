version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      actions-all:
        patterns: ["*"]

  # Gradle (SDK module)
  - package-ecosystem: "gradle"
    directory: "/sdk/java"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      sdk-minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "org.junit*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.google.protobuf*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "io.substrait*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle*"
        update-types: ["version-update:semver-major"]
